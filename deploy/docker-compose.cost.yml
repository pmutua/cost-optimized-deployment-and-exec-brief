# docker-compose.cost.yml - Deliverable 2: runnable deploy path for the
# AfyaPlus triage API, sized and tagged to match ../cost/cost_model.py's
# assumptions (footnote [4]/[5]: 0.5 vCPU / 1 GiB per instance, ~5,000
# req/day capacity) so the deploy config and the cost model describe the
# same thing instead of two disconnected numbers.
#
# Run it:
#   docker compose -f docker-compose.cost.yml up --build
#   curl http://localhost:8000/health
#
# Cache lever (Deliverable 3) runs in-process (api/ has no Redis
# dependency) -- see ../levers/ -- so no cache service is declared here.
# capstone_extras fallback declared: no Redis, no paid cloud account (see
# budget_alert_notes.md and the top-level README's "Fallbacks declared").

services:
  triage-api:
    build:
      context: ../api
      dockerfile: Dockerfile
    image: afyaplus-triage:cost-optimised
    ports:
      - "8000:8000"
    env_file:
      - ../api/.env
    environment:
      SERVICE_NAME: afyaplus-triage-api
    # Mirrors cost_model.py's INSTANCE_MONTHLY_COST_USD sizing (footnote
    # [4]): 0.5 vCPU / 1 GiB. If you resize this, update the footnote and
    # re-run cost_model.py so the deploy config and the cost model agree.
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 512M
    # FinOps tags: cost allocation/ownership metadata a cloud budget
    # console (or `docker inspect`) can read back. Mirrors the tag keys
    # used in azure_budget_triage.json's costAllocationRuleTags and
    # aws_budget.json's CostFilters so the same tag vocabulary shows up
    # whether the workload runs locally or in a cloud budget scope.
    labels:
      finops.cost-center: "afyaplus-clinical-ops"
      finops.owner: "pmutua@live.com"
      finops.environment: "capstone-week7"
      finops.workload: "triage-api"
      finops.budget-ceiling-usd-month: "20"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
